<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>新建任务</title>
    <script>
      try {
        var cachedTheme = localStorage.getItem('todo.theme');
        if (cachedTheme === 'dark' || cachedTheme === 'light') {
          document.documentElement.dataset.theme = cachedTheme;
        }
      } catch (error) {
        /* localStorage 不可用时保持默认浅色 */
      }
    </script>
  </head>
  <body class="quick-add-window">
    <div id="quick-add-root"></div>
    <script type="module" src="/src/quick-add-main.ts"></script>
  </body>
</html>
