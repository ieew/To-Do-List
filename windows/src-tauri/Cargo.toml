[package]
name = "todo-windows"
version = "0.1.0"
description = "待办清单 Windows 桌面端"
authors = ["Todo Team"]
edition = "2021"
rust-version = "1.77.2"
# 加了第二个 bin（export_bindings）后，tauri CLI 靠这个字段识别主程序。
default-run = "todo-windows"

[[bin]]
name = "export_bindings"
path = "src/bin/export_bindings.rs"
# 仅导出前端 IPC bindings 时编译，默认构建不碰它。
required-features = ["bindings-export"]

[lib]
name = "todo_windows_lib"
# 桌面端仅需 rlib；MinGW/UCRT 下 cdylib 会触发导出序号过大。
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[features]
default = ["desktop"]
desktop = [
    "dep:tauri",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-single-instance",
    "dep:tauri-plugin-autostart",
    "dep:tauri-specta",
    # dsh 实时通道（MQTT nudge）只在桌面端编译。
    "dep:rumqttc",
]
# 生成 src/lib/ipc-bindings.generated.ts 时才需要（npm run gen:bindings）。
bindings-export = ["desktop", "dep:specta-typescript"]

[dependencies]
todo-ai-core = { path = "ai-core" }
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["clock"] }
keyring = { version = "3", features = ["windows-native"] }
thiserror = "2"
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
tokio = { version = "1", features = ["time", "sync", "macros", "rt-multi-thread"] }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-opener = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
# dsh 推送通道：MQTT 只做「唤醒信号」，权威数据仍走 HTTP pull。
# 用 native-tls（Windows 上是 schannel），避免引入 ring 在 MinGW 下的编译风险；
# 服务端默认不启用 MQTT TLS，tls=true 时客户端会降级为 HTTP 轮询。
rumqttc = { version = "0.25", default-features = false, features = ["use-native-tls"], optional = true }

[target.'cfg(windows)'.dependencies]
# Windows Toast 直接调用 WinRT：插件会吞掉 show() 的错误，且无法注册 AUMID。
tauri-winrt-notification = "0.8"
# 注册 HKCU\Software\Classes\AppUserModelId\<id>，让未打包应用也能弹 Toast。
winreg = "0.56"
# 固定 RC 版本：specta 2 生态仍在 beta，必须用 = 锁定，避免升级漂移。
specta = { version = "=2.0.0-rc.28", features = ["derive", "serde_json"] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"], optional = true }
specta-typescript = { version = "0.0.15", optional = true }
