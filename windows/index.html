<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>待办清单</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8fafc;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Helvetica Neue', Arial, sans-serif;
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      #boot .boot-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        color: #3b82f6;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot .boot-bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: #e5e7eb;
      }
      #boot .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #3b82f6;
        animation: boot-slide 900ms ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.85;
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #boot {
          background: #0f172a;
        }
        #boot {
          color: #94a3b8;
        }
        #boot .boot-logo {
          background: rgba(59, 130, 246, 0.16);
          color: #60a5fa;
        }
        #boot .boot-bar {
          background: #1e293b;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-logo,
        #boot .boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-logo" aria-hidden="true">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="m8.5 12.5 2.2 2.2 4.8-5" />
        </svg>
      </div>
      <span>待办清单</span>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
