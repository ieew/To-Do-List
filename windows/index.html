<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>待办清单</title>
    <script>
      // 仅缓存 UI 偏好：让启动占位在首帧就用对主题，避免暗色用户看到浅色闪变。
      try {
        var cachedTheme = localStorage.getItem('todo.theme');
        if (cachedTheme === 'dark' || cachedTheme === 'light') {
          document.documentElement.dataset.theme = cachedTheme;
        }
      } catch (error) {
        /* localStorage 不可用时保持默认浅色 */
      }
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f8fafc;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8fafc;
        color: #6b7280;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei',
          'Helvetica Neue', Arial, sans-serif;
        font-size: 12.5px;
        letter-spacing: 0.02em;
      }
      #boot .boot-logo {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #eff6ff;
        color: #3b82f6;
        animation: boot-pulse 1.1s ease-in-out infinite;
      }
      #boot .boot-bar {
        width: 96px;
        height: 3px;
        border-radius: 999px;
        overflow: hidden;
        background: #e5e7eb;
      }
      #boot .boot-bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        border-radius: inherit;
        background: #3b82f6;
        animation: boot-slide 900ms ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.94);
          opacity: 0.85;
        }
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-110%);
        }
        100% {
          transform: translateX(360%);
        }
      }
      /* 主题以 localStorage 里的 UI 偏好为准（与应用内设置一致），
         不再跟随系统深浅色，避免「系统暗色 + 应用浅色」时启动闪暗。 */
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #boot {
        background: #0f172a;
      }
      html[data-theme='dark'] #boot {
        color: #94a3b8;
      }
      html[data-theme='dark'] #boot .boot-logo {
        background: rgba(59, 130, 246, 0.16);
        color: #60a5fa;
      }
      html[data-theme='dark'] #boot .boot-bar {
        background: #1e293b;
      }
      #boot.boot-leave {
        opacity: 0;
        transition: opacity 180ms ease-out;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-logo,
        #boot .boot-bar::after {
          animation: none;
        }
        #boot.boot-leave {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="boot-logo" aria-hidden="true">
        <svg
          width="20"
          height="20"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="4" />
          <path d="m8.5 12.5 2.2 2.2 4.8-5" />
        </svg>
      </div>
      <span>待办清单</span>
      <div class="boot-bar" aria-hidden="true"></div>
    </div>
    <script>
      // 启动提速：主窗口在 Rust 侧是隐藏创建的。这段脚本不依赖任何模块，
      // 会比主入口先执行，让用户尽快看到上面的 Logo 占位。
      // 失败也无妨：main.ts 挂载时还会再显示一次，Rust 侧另有 3 秒兜底。
      (function () {
        var internals = window.__TAURI_INTERNALS__;
        if (!internals || typeof internals.invoke !== 'function') return;
        try {
          internals.invoke('plugin:window|show', { label: 'main' }).catch(function () {});
          internals.invoke('plugin:window|set_focus', { label: 'main' }).catch(function () {});
        } catch (error) {
          /* 忽略 */
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
