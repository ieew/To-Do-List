org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
# 并行构建会让 KSP/Hilt 在依赖模块的 jar 尚未产出时开始处理，
# 表现为 "Xxx could not be resolved" 或 build/generated/ksp 为空，
# 从而打出编译通过但一进页面就闪退的包（NoSuchMethodException: <init> []）。
# 本仓库模块数不多，串行构建的代价可以接受。
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
# KSP 增量处理在 AGP 9 + KSP2 下会漏生成 @HiltViewModel 的 *Factory，
# 表现为 TasksViewModel 等退化成反射无参构造直接闪退；本项目规模小，全量生成即可。
ksp.incremental=false

android.useAndroidX=true
android.nonTransitiveRClass=true
# 仓库路径含中文，AGP 默认会拒绝；此处显式放行。
android.overridePathCheck=true

kotlin.code.style=official
